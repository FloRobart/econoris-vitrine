# Additions to the main configuration of the base image, copied to /etc/nginx/conf.d/.
# The base image includes conf.d/*.conf inside its http block, so only directives
# valid in the http context can go here.

# Sends the headers and the start of a file in a single packet (only applies with sendfile)
tcp_nopush on;

# Request errors only: without this, the base image logs them from the "notice" level
error_log /dev/stderr warn;
