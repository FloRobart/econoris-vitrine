# Main nginx configuration, copied to /etc/nginx/nginx.conf.
#
# Every writable path is set explicitly so that the container does not depend on
# the defaults of the base image. These paths are tmpfs mounts in docker-compose.yml
# because the root filesystem of the container is read-only.

worker_processes auto;

pid /var/run/nginx.pid;

# The hardened image has no log files: everything goes to the container output
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # Only the site server block: nothing shipped by the base image is loaded
    include /etc/nginx/conf.d/default.conf;
}
