# Production only. Development uses docker-compose.dev.yml.
# No "build" section: a missing image must fail, not trigger a compilation on the server.
services:
  econoris-vitrine:
    image: florobart/econoris-vitrine:${VITRINE_VERSION:-latest}
    restart: always

    # No Docker healthcheck: the hardened image has neither a shell nor wget.
    # Traefik checks the site over HTTP instead (dynamic/routes.yml of econoris-proxy).

    # No published port: the site is only reachable through Traefik
    networks:
      - econoris-vitrine-net

    # ---- Privileges ----
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ipc: none

    # ---- Resource limits: a flood of requests must not affect the other containers ----
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1
    pids_limit: 64

    # Access logs are driven by external requests: without rotation they could fill the disk
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    # The only writable paths: nginx writes its PID file and its temporary folders here.
    # The sizes prevent these in-memory mounts from filling up the memory.
    tmpfs:
      - /run/nginx:size=64k,mode=0700,uid=65532,gid=65532,noexec,nosuid,nodev
      - /var/cache/nginx:size=1m,mode=0700,uid=65532,gid=65532,noexec,nosuid,nodev

networks:
  # No access to the outside: this container only serves static files to Traefik
  econoris-vitrine-net:
    name: econoris-vitrine-net
    internal: true
