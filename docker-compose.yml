services:
  # Econoris Vitrine #
  econoris-vitrine:
    image: florobart/econoris-vitrine:latest
    restart: always
    # No published port: the site is only reachable through Traefik, on this network
    networks:
      - flower-garden-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "1800:1800"
    # The only writable paths: nginx creates its temporary folders in /var/cache/nginx.
    # The sizes prevent these in-memory mounts from filling up the host memory.
    tmpfs:
      - /var/run:rw,noexec,nosuid,nodev,size=1m,mode=0755,uid=1800,gid=1800
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0755,uid=1800,gid=1800
    # No Docker healthcheck: the hardened image has neither a shell nor wget.
    # Traefik checks the site over HTTP instead (see the healthcheck labels below).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=flower_garden_flower-garden-net"
      - "traefik.http.routers.econoris-vitrine.rule=Host(`econoris.fr`) || Host(`www.econoris.fr`)"
      - "traefik.http.routers.econoris-vitrine.entrypoints=websecure"
      - "traefik.http.routers.econoris-vitrine.tls.certresolver=le"
      - "traefik.http.services.econoris-vitrine.loadbalancer.server.port=8080"
      - "traefik.http.services.econoris-vitrine.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.econoris-vitrine.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.econoris-vitrine.loadbalancer.healthcheck.timeout=5s"
      # www.econoris.fr -> econoris.fr (301) : une seule URL canonique pour le SEO.
      # "$$" échappe le "$" pour docker compose (Traefik reçoit "${1}").
      - "traefik.http.routers.econoris-vitrine.middlewares=econoris-vitrine-redirect-www"
      - 'traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.regex=^https?://www\.econoris\.fr/(.*)'
      - "traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.replacement=https://econoris.fr/$${1}"
      - "traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.permanent=true"

networks:
  flower-garden-net:
    external: true
