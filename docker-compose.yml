services:
  # Econoris Vitrine #
  econoris-vitrine:
    image: florobart/econoris-vitrine:latest
    working_dir: /app
    restart: always
    networks:
      - flower-garden-net
    ports:
      - ${APP_PORT:-}:80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    user: "1800:1800"
    tmpfs:
      - /tmp:exec,nosuid,nodev,uid=1800,gid=1800
      - /run:rw,mode=0755,uid=1800,gid=1800
      - /run/nginx:rw,mode=0755,uid=1800,gid=1800
      - /var/cache/nginx:rw,uid=1800,gid=1800
      - /var/cache/nginx/client_temp:rw,uid=1800,gid=1800
      - /var/cache/nginx/proxy_temp:rw,uid=1800,gid=1800
      - /var/cache/nginx/fastcgi_temp:rw,uid=1800,gid=1800
      - /var/cache/nginx/uwsgi_temp:rw,uid=1800,gid=1800
      - /var/cache/nginx/scgi_temp:rw,uid=1800,gid=1800
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=flower_garden_flower-garden-net"
      - "traefik.http.routers.econoris-vitrine.rule=Host(`econoris.fr`) || Host(`www.econoris.fr`)"
      - "traefik.http.routers.econoris-vitrine.entrypoints=websecure"
      - "traefik.http.routers.econoris-vitrine.tls.certresolver=le"
      - "traefik.http.services.econoris-vitrine.loadbalancer.server.port=80"
      # www.econoris.fr -> econoris.fr (301) : une seule URL canonique pour le SEO.
      # "$$" échappe le "$" pour docker compose (Traefik reçoit "${1}").
      - "traefik.http.routers.econoris-vitrine.middlewares=econoris-vitrine-redirect-www"
      - 'traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.regex=^https?://www\.econoris\.fr/(.*)'
      - "traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.replacement=https://econoris.fr/$${1}"
      - "traefik.http.middlewares.econoris-vitrine-redirect-www.redirectregex.permanent=true"

networks:
  flower-garden-net:
    external: true
