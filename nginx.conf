server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas dévoiler la version nginx
    server_tokens off;

    # Redirections relatives (/installer -> /installer/) : évite d'exposer
    # le port interne quand le site est derrière un reverse proxy.
    absolute_redirect off;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        # Site 100 % statique : seules les lectures sont autorisées
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    # Pages HTML : toujours revalider pour publier les mises à jour immédiatement
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fichiers générés par Astro : nom contenant un hash, donc cache permanent
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fichiers lus par les robots (Google, Bing, moteurs IA) : cache court
    location ~* ^/(robots\.txt|llms\.txt|llms-full\.txt|sitemap.*\.xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Manifeste web : type MIME absent du mime.types de nginx
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        types { }
        default_type application/manifest+json;
    }

    # Autres ressources statiques (icônes, image de partage…)
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
}
